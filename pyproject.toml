[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradscf"
version = "1.0.0"
description = "JAX toolkit for differentiable Hartree-Fock and Kohn-Sham SCF, response theory, and Neural XC training."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "GradSCF developers"},
]
dependencies = [
  "jax>=0.4.14",
  "jaxlib>=0.4.14",
  "flax>=0.10.7,<0.11; python_version < '3.11'",
  "flax>=0.12.0; python_version >= '3.11'",
  "jaxtyping>=0.2.36",
  "numpy>=1.24",
  "optax>=0.2.6",
]

[project.urls]
Repository = "https://github.com/STOKES-DOT/GradSCF"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
upstreams = [
  "jax-xc>=0.0.12",
  "pyscf>=2.3.0",
]
reproducibility = [
  "h5py>=3.8",
  "jax-xc>=0.0.12",
  "matplotlib>=3.7",
  "pyscf>=2.3.0",
  "scipy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["gradscf.integrals._native.*"]

[tool.setuptools.package-data]
"gradscf.data" = [
  "_pyscf_basis_bundle.json",
  "_lebedev_level*.npz",
  "pyscf_basis_snapshot/**/*",
]
"gradscf.integrals._native" = [
  "CMakeLists.txt",
  "README.md",
  "exports.*",
  "csrc/*.cc",
  "include/*.h",
  "patches/*.md",
  "vendor/**/*",
]

[tool.setuptools.exclude-package-data]
"gradscf.integrals._native" = ["build/**/*", "lib/*"]
